    el.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.v === p.rodzaj));
    el.querySelector('[data-block="papier"]').style.display = p.rodzaj === 'papier' ? '' : 'none';
    el.querySelector('[data-block="rpet"]').style.display = p.rodzaj === 'rpet' ? '' : 'none';

    if (p.rodzaj === 'papier') {
        ['pojemnosc', 'material', 'scianka', 'wieczko_material', 'wieczko_kolor'].forEach(f => {
            const grp = el.querySelector(`.bgrp[data-field="${f}"]`);

            grp.querySelectorAll('button').forEach(b => {

        if (p.pojemnosc === 180) {
            dwBtn.disabled = true;
            if (p.scianka === 'DW') {
                p.scianka = 'SW';
                renderPosition(p, idx);
                return;
            }
        }

        upStp(el, 'ilosc', p);

        const rozmiar = ROZMIAR_WIECZKA[p.pojemnosc];
        el.querySelector('[data-rozmiar]').textContent = `Ø ${rozmiar} mm`;

        const papBtn = el.querySelector('.bgrp[data-field="wieczko_material"] button[data-v="papierowe"]');
        const papHint = el.querySelector('[data-papier-hint]');
        if (rozmiar === 72) {
            papBtn.disabled = true;
            papHint.textContent = 'papierowe niedostępne w Ø 72';
            if (p.wieczko_material === 'papierowe') {
                p.wieczko_material = 'plastikowe';
                renderPosition(p, idx);
                return;
            }
        } else
            papHint.textContent = '';

            if (p.wieczko_kolor === 'czarny') {
                p.wieczko_kolor = 'biały';
                renderPosition(p, idx);

            }

        const showLids = p.wieczko_material !== 'brak';
        el.querySelector('[data-row="kolor"]').style.display = (showLids && p.wieczko_material === 'plastikowe') ? '' : 'none';
        el.querySelector('[data-row="wieczko_ilosc"]').style.display = showLids ? '' : 'none';
        upStp(el, 'wieczko_ilosc', p);

    if (p.rodzaj === 'rpet') {
        ['rpet_pojemnosc', 'rpet_strony', 'rpet_kolory'].forEach(f => {

                b.classList.toggle('active', b.dataset.v === String(p[f]));

        upStp(el, 'rpet_ilosc', p);

    el.querySelectorAll('.alert').forEach(a => a.classList.remove('show'));

function upStp(el, field, p) {
    const stp = el.querySelector(`.stp[data-stp="${field}"]`);
    if (!stp)
        return;
    const min = Number(stp.dataset.min),
        max = Number(stp.dataset.max);
    stp.querySelector('.stp-val').textContent = fmtNum(p[field]);
    stp.querySelector('[data-act="dec"]').disabled = (p[field] <= min);
    stp.querySelector('[data-act="inc"]').disabled = (p[field] >= max);
}

function renderAll() {
    positions.forEach((p, idx) => renderPosition(p, idx));
    renderSummary();

function calcItem(p) {
    return p.rodzaj === 'rpet' ? calcRpet(p) : calcPapier(p);
}

function calcPapier(p) {
    if (p.scianka === 'DW' && p.pojemnosc === 180)
        return {
            error: 'Nie produkujemy dwuściennych 180 ml.'
        };
    if (p.ilosc < ILOSC_PAP_MIN || p.ilosc % ILOSC_PAP_STEP !== 0)
        return {
            error: 'Wybierz wielokrotność 1 000 szt.'
        };
    if (p.ilosc > ILOSC_PAP_MAX)
        return {
            error: 'Powyżej 20 000 szt. — wycena indywidualna.'
        };

    let typ;
    if (p.scianka === 'SW')
        typ = 'SW';
    else if (p.pojemnosc === 100)
        typ = 'DW_sleeve';
    else
        typ = 'DW_term';

    let prog;
    if (p.ilosc < 5000)
        prog = 1000;
    else if (p.ilosc < 10000)
        prog = 5000;
    else if (p.ilosc < 20000)
        prog = 10000;
    else
        prog = 20000;

    const w = CENNIK_PAP.find(c => c.typ === typ && c.material === p.material && c.pojemnosc_ml === p.pojemnosc && c.prog_ilosc === prog);
    if (!w)
        return {
            error: 'Brak ceny dla tej konfiguracji.'
        };

    const itys = p.ilosc / 1000;
    const m = MARZE.find(x => x.ilosc_tys === itys);
    if (!m)
        return {
            error: 'Brak stawki marży.'
        };

    const bazowa = Number(w.cena_per_1000) * itys;
    const kubki = Math.round(bazowa * (1 + Number(m.marza_proc) / 100));

    let wieczka = 0;
    if (p.wieczko_material !== 'brak' && p.wieczko_ilosc > 0) {
        const rozmiar = ROZMIAR_WIECZKA[p.pojemnosc];
        const typMat = p.wieczko_material === 'plastikowe' ? 'plastikowa' : 'papierowa';
        const kolor = (typMat === 'papierowa') ? 'biały' : p.wieczko_kolor;
        const ww = WIECZKA.find(x => x.typ_materialu === typMat && Number(x.rozmiar_mm) === rozmiar && x.kolor === kolor);
        if (ww)
            wieczka = Math.round(Number(ww.cena_netto) * (p.wieczko_ilosc / 100));
    }
    return {
        kubki,
        wieczka
    };
}

function calcRpet(p) {
    const kartony = Math.round((p.rpet_ilosc || 800) / 800);
    if (kartony < 1)
        return {
            error: 'Wybierz co najmniej 800 szt. (1 pudło).'
        };
    if (kartony > RPET_MAX_KARTONOW)
        return {
            error: 'Powyżej 19 200 szt. — wycena indywidualna.'
        };

    let prog;
    if (kartony >= 13)
        prog = 13;
    else if (kartony >= 7)
        prog = 7;
    else if (kartony >= 4)
        prog = 4;
    else if (kartony >= 2)
        prog = 2;
    else
        prog = 1;

    const w = CENNIK_RPET.find(c =>
    c.pojemnosc_ml === p.rpet_pojemnosc &&
    c.strony === p.rpet_strony &&
    c.kolory === p.rpet_kolory &&
    c.prog_kartonow === prog
    );
    if (!w)
        return {
            error: 'Brak ceny dla tej konfiguracji rPET.'
        };

    const bazowa = Number(w.cena_per_800) * kartony;
    const kubki = Math.round(bazowa * (1 + RPET_MARZA));
    const wKartony = Math.round((p.rpet_wieczka_ilosc || 0) / 800);
    const wieczka = wKartony * WIECZKO_RPET_CENA_800;
    return {
        kubki,
        wieczka
    };
}

function collectPackages() {
    const pkgs = [];
    for (const p of positions) {
        const c = calcItem(p);
        if (c.error)
            continue;

        if (p.rodzaj === 'papier') {
            const szt = (p.scianka === 'DW' && p.pojemnosc !== 100) ? 500 : 1000;
            const n = Math.ceil(p.ilosc / szt);
            if (n > 0)
                pkgs.push({
                    obj: PUDLO_PAP_KUBKI,
                    qty: n
                });
            if (p.wieczko_material !== 'brak' && p.wieczko_ilosc > 0) {
                pkgs.push({
                    obj: PUDLO_PAP_WIECZKA,
                    qty: Math.ceil(p.wieczko_ilosc / 1000)
                });
            }
        } else {
            const obj = p.rpet_pojemnosc === 500 ? PUDLO_RPET_500 : PUDLO_RPET_300_400;
            const kart = Math.round((p.rpet_ilosc || 800) / 800);
            pkgs.push({
                obj,
                qty: kart
            });
            const wKart = Math.round((p.rpet_wieczka_ilosc || 0) / 800);
            if (wKart > 0) {
                pkgs.push({
                    obj: PUDLO_RPET_300_400,
                    qty: wKart
                });
            }
        }
    }
    return pkgs;
}

function calcShipping() {
    const pkgs = collectPackages();
    const totalPudel = pkgs.reduce((s, p) => s + p.qty, 0);
    if (totalPudel === 0)
        return {
            palety: 0,
            dpd: 0,
            total: 0,
            opis: '—'
        };

    const dpdAll = totalPudel * DPD_ZA_PUDLO;
    if (dpdAll <= DPD_PROG_PALETY) {
        return {
            palety: 0,
            dpd: dpdAll,
            total: dpdAll,
            opis: `kurier DPD · ${totalPudel} ${odmianaPudel(totalPudel)}`
        };
    }

    let lista = [];
    for (const pk of pkgs)
        for (let i = 0; i < pk.qty; i++)
            lista.push(pk.obj);
    lista.sort((a, b) => b - a);

    let palety = 0;
    while (lista.length * DPD_ZA_PUDLO > DPD_PROG_PALETY) {
        palety++;
        if (palety > MAX_PALET) {
            return {
                palety: -1,
                dpd: 0,
                total: null,
                opis: 'wysyłka paletowa — wycena indywidualna'
            };
        }
        let free = 1.0;
        let i = 0;
        while (i < lista.length) {
            if (lista[i] <= free + 1e-9) {
                free -= lista[i];
                lista.splice(i, 1);
            } else
                i++;
        }
    }
    const restDpd = lista.length * DPD_ZA_PUDLO;
    let opis = `${palety} ${odmianaPalet(palety)} × ${PALETA_KOSZT} zł`;
    if (restDpd > 0)
        opis += ` + DPD ${lista.length} ${odmianaPudel(lista.length)}`;
    return {
        palety,
        dpd: restDpd,
        total: palety * PALETA_KOSZT + restDpd,
        opis
    };
}

function odmianaPudel(n) {
    if (n === 1)
        return 'pudło';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14))
        return 'pudła';
    return 'pudeł';
}
function odmianaPalet(n) {
    if (n === 1)
        return 'paleta';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14))
        return 'palety';
    return 'palet';
}

function renderSummary() {
    const rows = $('#sum-rows');

        suma = 0,
        anyError = false;

        } else {
            const tot = c.kubki + c.wieczka;
            suma += tot;
            let opisLines = [];
            if (p.rodzaj === 'rpet') {

                opisLines.push(`${fmtNum(p.rpet_ilosc || 800)} szt. × kubek rPET ${p.rpet_pojemnosc} ml · ${strLabel} ${kolLabel}`);
                const wI = p.rpet_wieczka_ilosc || 0;
                if (wI > 0)
                    opisLines.push(`${fmtNum(wI)} szt. × wieczka rPET`);
            } else {
                const scLabel = p.scianka === 'DW' ? (p.pojemnosc === 100 ? 'DW sleeve' : 'DW term.') : 'SW';
                const matLabel = p.material === 'PE' ? 'TW' : 'BIO';
                opisLines.push(`${fmtNum(p.ilosc)} szt. × kubek ${p.pojemnosc} ml ${matLabel} ${scLabel}`);
                if (p.wieczko_material !== 'brak' && p.wieczko_ilosc > 0) {
                    const rozmiar = ROZMIAR_WIECZKA[p.pojemnosc];
                    const matW = p.wieczko_material === 'plastikowe' ? 'plast.' : 'pap.';
                    const kolW = p.wieczko_material === 'plastikowe' ? ' ' + p.wieczko_kolor : '';
                    opisLines.push(`${fmtNum(p.wieczko_ilosc)} szt. × wieczka ${matW} Ø${rozmiar} mm${kolW}`);
                }
            }
            const opisHtml = opisLines.map(l => `<span style="display:block;color:#9B8D78;font-size:12px;margin-top:3px">${l}</span>`).join('');
            html += `<div class="summary-row" style="align-items:flex-start"><span class="lbl">${lbl}${opisHtml}</span><span class="v" style="white-space:nowrap;padding-top:2px">${fmtPLN(tot)}</span></div>`;
        }
    });

    const ship = calcShipping();
    const sumTot = suma + (ship.total || 0);
    html += `<div class="summary-row ship"><span class="lbl">Dostawa<span class="sub">${ship.opis}</span></span><span class="v">${ship.total === null ? 'indyw.' : fmtPLN(ship.total || 0)}</span></div>`;

    rows.innerHTML = html;
    $('#sum-total').textContent = (anyError && suma === 0) ? '—'
    : (ship.total === null ? 'wycena indyw.' : fmtPLN(sumTot));
}

loadData();
</script>
